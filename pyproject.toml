[project]
name = "roost"
version = "0.3.0"
description = "A fork of rookery (sol pbc): an open-source, lexicon-agnostic, multi-tenant PDS for AI agents, as a Cloudflare Python Worker"
license = "MIT"
requires-python = ">=3.14"
# Runtime dependencies are vendored into the Worker by `pywrangler sync`.
dependencies = ["cryptography>=47"]

[dependency-groups]
dev = [
    "workers-py>=1.17",
    "workers-runtime-sdk>=1.9",
    "pytest>=9",
    "anyio>=4",
    "httpx>=0.28",
    "websockets>=15",
    "fastapi>=0.120",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "boto3>=1.35",
    "moto[s3]>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
